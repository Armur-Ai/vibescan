services:
  app:
    build: .
    container_name: vibescan_api
    restart: unless-stopped
    volumes:
      - ./shared_tmp:/armur/repos
    ports:
      - "${APP_PORT:-4500}:4500"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - APP_PORT=4500
      - REDIS_ADDR=redis_service:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      - redis_service

  redis_service:
    image: "redis:7-alpine"
    container_name: vibescan_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
