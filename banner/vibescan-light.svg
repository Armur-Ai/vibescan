<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="vibescan: code from Cursor, Claude Code, Copilot and Windsurf flows through security scanners and comes out either ready to ship or flagged">
<style>
  .flow { fill: none; stroke-width: 2; stroke-dasharray: 7 7; animation: flow 1.4s linear infinite; }
  .chip { animation: pulse 3.2s ease-in-out infinite; }
  .beam { animation: sweep 3.2s ease-in-out infinite; }
  .hit { animation: blink 1.6s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes sweep { 0% { transform: translateX(0); } 50% { transform: translateX(384px); } 100% { transform: translateX(0); } }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flow, .chip, .beam, .hit { animation: none; opacity: 1; } }
</style>
<rect width="1200" height="400" rx="16" fill="#ffffff"/>
<text x="600" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700" letter-spacing="3"><tspan fill="#0f766e">vibe</tspan><tspan fill="#b45309">scan</tspan></text>
<text x="600" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">Security scanner for AI-generated code</text>
